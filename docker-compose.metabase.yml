services:
  metabase:
    image: metabase/metabase:latest
    container_name: mtp-metabase-bi
    restart: unless-stopped
    ports:
      - "8100:3000"
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - JAVA_OPTS=-Xmx1024m -Xms256m -Duser.timezone=Asia/Ho_Chi_Minh
      - MB_SITE_NAME=Minh Tân Phát BI Analytics
      - MB_APPLICATION_NAME=MTP BI
      - MB_ANON_TRACKING_ENABLED=false
      - MB_EMBEDDING_SECRET_KEY=${MB_EMBEDDING_SECRET_KEY:-mtp_metabase_bi_secret_key_2026_poultry_farm}
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./metabase_data:/metabase-data
    networks:
      - supabase_network_minh-tan-phat-supply
      - sss_homelab_net

networks:
  supabase_network_minh-tan-phat-supply:
    external: true
  sss_homelab_net:
    external: true
